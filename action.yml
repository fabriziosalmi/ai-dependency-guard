name: 'AI Dependency Guard'
description: 'Blocks CI/CD pipelines if LLM-hallucinated (non-existent) packages are detected in manifests.'
author: 'Fabrizio Salmi'
branding:
  icon: 'shield'
  color: 'red'
inputs:
  scan_path:
    description: 'Path to scan for requirements.txt and package.json files'
    required: false
    default: '.'
  blocklist:
    description: 'Comma-separated list of explicitly blocked packages (e.g., known defensively squatted or hijacked packages)'
    required: false
    default: 'keyrings,jaraco,google-colab,ruamel,en_core_web_sm'
runs:
  using: 'docker'
  image: 'Dockerfile'
